# 領域（Domain）定義 - 單一事實來源
#
# 用途：
#   - Hugo：layouts/domains/*.html 讀取 site.Data.domains 顯示領域名稱與子主題
#   - 腳本：scripts/migrate_domain_tags.py 依 [aliases] 將舊的 domain/* tag 轉為
#           卡片 frontmatter 的 domains / domain_topics 欄位
#
# 卡片寫法：
#   domains:
#     - economics
#   domain_topics:
#     - economics/finance
#
# 新增領域：在 [[domains]] 加一筆；slug 使用英文小寫與連字號（成為網址 /domains/{slug}/）

# 注意：TOML 中最上層的設定必須寫在第一個 [[表格]] 之前
# 視為領域的「無前綴」tag（遷移時與 domain/* 相同處理：轉為 domains 欄位並從 tags 移除）
# 只列意思明確的；commerce、transaction、business 等常表示情境而非領域，不列入
bare_tags = [
  # 經濟
  "経済学", "経済", "economics", "金融", "finance", "banking", "投資", "商業", "accounting", "tax", "trade",
  # 語言學
  "linguistics", "言語学", "pragmatics", "語用論", "semantics", "sociolinguistics", "社会言語学", "information_structure",
  # 學習與教育
  "learning", "education", "教育", "language_learning",
  # 其他領域
  "daily_life", "daily-life", "communication", "movement", "perception", "cognition", "psychology", "心理学", "technology",
  # 社會
  "society", "社会", "politics", "政治", "government", "policy", "law", "法律", "culture",
]
# 刻意不列入（多表示情境或卡片類型，而非領域）：
#   grammar, keigo, onomatopoeia, business, commerce, transaction, location, language, methodology, international, abstract

